# Self-test: run the reusable workflow from this repo itself.
name: Self-Test
on:
  workflow_dispatch:
    inputs:
      language:
        description: "python | go | javascript | none"
        required: false
        default: "python"
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      language: ${{ github.event.inputs.language || 'python' }}
    secrets: inherit
